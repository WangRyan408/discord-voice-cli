[package]
name = "discord-voice-cli"
version = "0.1.0"
authors = ["Noskcaj <kcajdev@gmail.com>"]
edition = "2024"
rust-version = "1.89"

[dependencies]
cpal = "0.18.2"
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
# Serenity's Rustls backend pins an older Rustls release with security advisories.
# Keep this release pinned while the local user-token patch is maintained.
serenity = { version = "=0.12.5", default-features = false, features = ["client", "gateway", "model", "native_tls_backend", "user_token", "voice"] }
songbird = { version = "0.6.1", default-features = false, features = ["driver", "gateway", "native", "receive", "serenity", "tungstenite"] }
# Enable the PCM decoder used by Songbird's live microphone adapter.
symphonia = { version = "0.5.5", default-features = false, features = ["pcm"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync"] }

[patch.crates-io]
serenity = { path = "vendor/serenity" }
